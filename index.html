<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegressionBall | 10-Minute AI Investigation</title><style>
:root{font-family:system-ui,sans-serif;background:#101827;color:#edf3ff}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2{font-size:clamp(24px,3vw,33px);margin:8px 0}.muted{color:#a7bad0}.small{font-size:13px}.steps{display:flex;gap:7px;margin:18px 0}.step{flex:1;height:8px;background:#384b61;border-radius:50px}.step.active{background:#f5ca59}.panel{background:#1c2a3c;border:1px solid #41536b;border-radius:16px;padding:clamp(15px,3vw,25px);margin:12px 0}.lead{font-size:18px;max-width:780px;line-height:1.5}.tag{font-weight:900;letter-spacing:.1em;color:#63dfbc;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{padding:16px;border-radius:12px;background:#121e2d}strong.value{font-size:29px;color:#f5ca59}.chart{width:100%;height:auto;max-height:365px;background:#142134;border-radius:12px;border:1px solid #3d4b60}button{padding:13px 20px;background:#f5ca59;color:#171b22;font-weight:900;border:0;border-radius:10px;cursor:pointer;font-size:16px}button:disabled{opacity:.4;cursor:not-allowed}button.alt{background:#35485f;color:white}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;padding:12px;background:#0e1a29;color:white;border:1px solid #5a7189;border-radius:9px;font:inherit}textarea{min-height:76px}.choice{display:block;border:1px solid #496078;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:#152337}.choice:has(input:checked){border-color:#f5ca59;background:#353527}.choice input{width:auto;margin-right:12px;accent-color:#f5ca59}.hidden{display:none!important}.line{height:1px;background:#485b70;margin:22px 0}.nav{display:flex;justify-content:space-between;margin-top:18px}.hint{background:#21384d;border-left:4px solid #63dfbc;padding:13px;border-radius:6px}.metric{font-weight:800;font-size:22px}ul{line-height:1.9}.notice{color:#f5ca59;font-weight:700}#status{min-height:24px}.review{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid,.review{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><main><header><div><div class="tag">AI INVESTIGATION · 10 MINUTES</div><h1>Can We Trust This AI?</h1></div><div class="muted">RegressionBall</div></header><div class="steps" id="steps"></div><section id="screen"></section><div class="nav"><button class="alt" id="back">← Back</button><button id="next">Continue →</button></div><p class="muted small">Your answers save automatically. Dataset values are provided. No class-period field.</p></main>
<script>
const key='regressionball_10min_visual_v1';let st;try{st=JSON.parse(localStorage.getItem(key))||{}}catch{st={}};st={page:0,name:'',answers:{},round1:false,round2:false,...st};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(key,JSON.stringify(st));
const train1=[[1,53],[2,62],[3,69],[4,77]];const train2=[[1,53],[2,62],[3,69],[4,77],[1,39],[2,50],[3,56],[4,65],[5,69],[6,76]];const test=[[2,49],[4,63],[5,70],[6,75]];
function fit(data){let n=data.length,x=data.reduce((a,p)=>a+p[0],0)/n,y=data.reduce((a,p)=>a+p[1],0)/n,w=data.reduce((a,p)=>a+(p[0]-x)*(p[1]-y),0)/data.reduce((a,p)=>a+(p[0]-x)**2,0);return {w,b:y-w*x}}const a=fit(train1),b=fit(train2),base={w:0,b:50};function err(data,m){return data.reduce((v,[x,y])=>v+Math.abs(y-(m.b+m.w*x)),0)/data.length}
function graph(data,model,withTest=false){let w=720,h=320,px=x=>52+(x/7)*635,py=y=>280-(y-25)/70*240;let html=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graph comparing actual scores and model predictions">`;for(let y=30;y<=90;y+=10){html+=`<line x1="52" x2="687" y1="${py(y)}" y2="${py(y)}" stroke="#7e94aa" opacity=".16"/><text x="41" y="${py(y)+4}" fill="#adbed0" font-size="13" text-anchor="end">${y}</text>`}for(let x=1;x<=6;x++){html+=`<text x="${px(x)}" y="298" fill="#adbed0" font-size="13" text-anchor="middle">${x}</text>`}html+=`<text x="355" y="317" fill="#adbed0" font-size="12" text-anchor="middle">Hours studied</text>`;if(model){html+=`<line x1="${px(0)}" y1="${py(model.b)}" x2="${px(7)}" y2="${py(model.b+7*model.w)}" stroke="#f5ca59" stroke-width="4"/>`}
for(const [x,y] of data){if(model){html+=`<line x1="${px(x)}" x2="${px(x)}" y1="${py(y)}" y2="${py(model.b+x*model.w)}" stroke="#ff9f86" stroke-width="2" opacity=".8"/>`}html+=`<circle cx="${px(x)}" cy="${py(y)}" r="6" fill="#63dfbc" stroke="#142134" stroke-width="2"/>`};if(withTest)for(let [x,y] of test){html+=`<rect x="${px(x)-5}" y="${py(y)-5}" width="10" height="10" fill="#bc9bff"/>`}html+='</svg>';return html}
function text(id,label){return `<label for="${id}">${label}</label><textarea id="${id}" data-answer="${id}" placeholder="Use evidence from the graph..."></textarea>`}
function choice(id,label,options){return `<label>${label}</label>`+options.map((v,i)=>`<label class="choice"><input type="radio" name="${id}" value="${i}" data-choice="${id}">${v}</label>`).join('')}
function screen(){switch(st.page){case 0:return `<div class="panel"><div class="tag">START · 1 MIN</div><h2>The Case</h2><p class="lead">A school wants to predict exam scores using <b>hours studied</b>. You are reviewing its AI before it makes decisions about tutoring.</p><label for="name">Student name</label><input id="name" placeholder="First and last name"><div class="hint"><b>Your mission:</b> Train a model twice, review its predictions, then decide whether the school should trust it.</div>${choice('start1','What is the model trying to predict?',['A numerical exam score.','Whether a student likes school.','A category of study habits.'])}${choice('start2','Which piece of information is the model using to make its prediction?',['The student’s name.','Hours studied.','The student’s favorite subject.'])}<div class="grid"><div class="mini"><strong class="value">2</strong><p>Training rounds</p></div><div class="mini"><strong class="value">1</strong><p>Final recommendation</p></div></div></div>`;
case 1:return `<div class="panel"><div class="tag">ROUND 1 · 3 MINUTES</div><h2>Train the first model</h2><p>Four training students are shown as <b style="color:#63dfbc">green dots</b>. Press Train to fit a prediction line to their scores.</p><div id="g1">${graph(train1,st.round1?a:base)}</div><div class="row"><button id="train1" ${st.round1?'disabled':''}>${st.round1?'✓ Model trained':'▶ Train model'}</button><span class="metric" id="m1">${st.round1?'Training error: '+err(train1,a).toFixed(1)+' points':'Not trained yet'}</span></div><div class="hidden" id="r1"><div class="hint">Green dots = actual scores. Yellow line = model predictions. Orange gaps = errors.</div>${choice('q1','The school only trained on these four students. What is the strongest concern?',['The model is guaranteed to be accurate.','Four examples may not represent other students.','The prediction line should be horizontal.'])}${text('why1','What does the graph show about how well the model fits these four students?')}${choice('q1b','A student studies 6 hours. Why might this model be unreliable for them?',['Six hours is outside the original training range.','Models cannot predict scores above 50.','Training with four students makes a perfect model.'])}${text('why1b','Look at the orange error gaps. Which training point seems hardest for the line to match, and what evidence shows that?')}</div></div>`;
case 2:return `<div class="panel"><div class="tag">ROUND 2 · 3 MINUTES</div><h2>Train with more varied students</h2><p>The school discovers its first dataset missed students with different results at similar study times. A broader set of <b>10 students</b> is now available.</p><div class="grid"><div class="mini"><div class="tag">BEFORE · 4 STUDENTS</div>${graph(train1,a)}<div>New-student error: <b>${err(test,a).toFixed(1)} points</b></div></div><div class="mini"><div class="tag">AFTER · 10 STUDENTS</div><div id="g2">${graph(train2,st.round2?b:base)}</div><div id="m2">${st.round2?'New-student error: <b>'+err(test,b).toFixed(1)+' points</b>':'Not trained yet'}</div></div></div><div class="row"><button id="train2" ${st.round2?'disabled':''}>${st.round2?'✓ Retrained':'▶ Train new model'}</button><span class="muted">Purple squares below represent new test students.</span></div><div class="hidden" id="r2"><div style="margin-top:15px">${graph(train2,b,true)}</div>${choice('q2','What does the test comparison suggest?',['More examples always guarantee zero error.','We must compare performance on unseen students.','Training error is the only number that matters.'])}${text('why2','Compare the new-student errors before and after. Did broader training help? Use both numbers.')}${choice('q2b','The broader dataset includes different scores for the same study time. What does that suggest?',['Study time is not the only factor affecting scores.','The new data must be deleted.','Every student studying 3 hours should score the same.'])}${text('why2b','Use one pair of same-hour students in the new dataset to explain why a prediction may be imperfect.')}</div></div>`;
case 3:return `<div class="panel"><div class="tag">FINAL REVIEW · 3 MINUTES</div><h2>Key Takeaways</h2><div class="review"><div class="mini"><h3>1. Regression</h3><p>Predicts a <b>number</b>, not a category.</p></div><div class="mini"><h3>2. Training</h3><p>Adjusts the model to better fit known examples.</p></div><div class="mini"><h3>3. Error</h3><p>Measures how far predictions are from actual values.</p></div><div class="mini"><h3>4. Testing</h3><p>Checks predictions on <b>unseen examples</b>.</p></div></div><div class="line"></div>${choice('q3','A model predicts 84, but the actual score is 74. What happened?',['Overprediction by 10 points.','Underprediction by 10 points.','Correct prediction.'])}${choice('q4','The training error is very low. What can you conclude?',['It will always predict correctly.','It fits the training examples well, but testing is still needed.','It does not use weights.'])}${choice('q5','What would make the evaluation more convincing?',['Test on more unseen students from different backgrounds.','Run predictions on the training students again.','Ignore cases with large errors.'])}${text('q6','If a model predicts a score of 80 and the actual score is 65, explain the direction and size of its error.')}${text('conclusion','FINAL DECISION: Should the school use this model alone to assign tutoring? Explain your decision using evidence from both rounds and one limitation.') }<div class="line"></div><button id="submit">Submit to Firebase</button> <button class="alt" id="backup">Download backup</button><p id="status" role="status"></p></div>`}}
function render(){let html=screen();$('screen').innerHTML=html;$('steps').innerHTML=Array.from({length:4},(_,i)=>`<div class="step ${i<=st.page?'active':''}"></div>`).join('');$('back').disabled=st.page===0;$('next').textContent=st.page===3?'Finish':'Continue →';$('next').disabled=st.page===3;
if($('name')){$('name').value=st.name;$('name').oninput=e=>{st.name=e.target.value;save()}}
document.querySelectorAll('[data-answer]').forEach(el=>{el.value=st.answers[el.dataset.answer]||'';el.oninput=e=>{st.answers[el.dataset.answer]=el.value;save()}});document.querySelectorAll('[data-choice]').forEach(el=>{el.checked=String(st.answers[el.dataset.choice])===el.value;el.onchange=e=>{st.answers[el.dataset.choice]=e.target.value;save()}});
if($('r1'))$('r1').classList.toggle('hidden',!st.round1);if($('r2'))$('r2').classList.toggle('hidden',!st.round2);
if($('train1'))$('train1').onclick=()=>{st.round1=true;save();render()};if($('train2'))$('train2').onclick=()=>{st.round2=true;save();render()};if($('backup'))$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='regressionball_investigation_'+(st.name||'student').replace(/[^a-z0-9]/gi,'_')+'.json';link.click();URL.revokeObjectURL(url)};if($('submit'))$('submit').onclick=submit;
}
$('back').onclick=()=>{st.page--;save();render();window.scrollTo(0,0)};$('next').onclick=()=>{if(st.page===0&&!st.name.trim()){alert('Enter your name first.');return}if(st.page===1&&!st.round1){alert('Train the first model.');return}if(st.page===2&&!st.round2){alert('Train the second model.');return}st.page=Math.min(3,st.page+1);save();render();window.scrollTo(0,0)};
async function submit(){if(!st.name.trim()){alert('Enter your name on the first page.');return}let needed=['start1','start2','q1','why1','q1b','why1b','q2','why2','q2b','why2b','q3','q4','q5','q6','conclusion'];let missing=needed.filter(k=>!String(st.answers[k]??'').trim());if(missing.length){$('status').textContent='Complete all questions before submitting ('+missing.length+' remaining).';return}let status=$('status');status.textContent='Submitting...';try{await window.submitToFirestore({activity:'regressionball_10min_visual_investigation',activityTitle:'Can We Trust This AI? (10-minute investigation)',name:st.name.trim(),studentName:st.name.trim(),answers:st.answers,trainingRounds:[{size:train1.length,trainingError:err(train1,a),testError:err(test,a)},{size:train2.length,trainingError:err(train2,b),testError:err(test,b)}],submittedAt:window.firebaseServerTimestamp()});status.textContent='✓ Submitted successfully';$('submit').disabled=true}catch(e){status.textContent='Submission failed: '+e.message+'. Download your backup and tell your teacher.'}}
render();
</script><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getFirestore,collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyA-MuWgWxgLKbfcXPfH16SlSazbQp4UYy0',authDomain:'regressionball.firebaseapp.com',projectId:'regressionball',storageBucket:'regressionball.firebasestorage.app',messagingSenderId:'243024495064',appId:'1:243024495064:web:dc2009ce99e6093275f2ad'};const app=initializeApp(firebaseConfig);const db=getFirestore(app);window.firebaseServerTimestamp=serverTimestamp;window.submitToFirestore=data=>addDoc(collection(db,'submissions'),data);</script></body></html>
